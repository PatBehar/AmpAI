name: AmpAI landing | Edu responsive QA
on:
  push:
    branches: [feat/ampai-landing-v3-cloudflare]
    paths: [index.html, styles.css, script.js, .github/workflows/edu-landing-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Responsive bilingual and functional QA (no email sent)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ampai-server.log 2>&1 &
          mkdir -p evidence
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const reports=[];
          try {
            for(const width of [1440,1280,1100,1024,900,768,430,390,360]){
              const page=await browser.newPage({viewport:{width,height:width>900?900:844},reducedMotion:'reduce'});
              const errors=[],badResponses=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('response',r=>{if(r.status()>=400 && r.url().includes('127.0.0.1'))badResponses.push(r.url()+': '+r.status())});
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              assert.equal(await page.locator('.product-card').count(),3);
              assert.equal(await page.locator('#edu .edu-role').count(),3);
              assert.equal(await page.locator('#edu .edu-level-grid>div').count(),4);
              assert.equal(await page.locator('#contact-interest option[value="AmpAI Edu"]').count(),1);
              for(const lang of ['en','es']){
                await page.locator('[data-language="'+lang+'"]').click();
                assert.equal(await page.locator('html').getAttribute('lang'),lang);
                assert.match(await page.locator('#edu h2').innerText(),lang==='es'?/Prepara a los estudiantes/:/Prepare students/);
                assert.match(await page.locator('#edu .edu-role').first().innerText(),lang==='es'?/Aplicación del estudiante/:/Student App/);
                assert.match(await page.locator('#edu .edu-role').last().innerText(),lang==='es'?/Portal de familias/:/Parent Portal/);
                assert.match(await page.locator('#products-title').innerText(),lang==='es'?/Tres caminos/:/Three paths/);
                const layout=await page.evaluate(()=>{
                  const rect=e=>{let r=e.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
                  const bounds=[...document.querySelectorAll('.product-card,.edu-role,.edu-level-grid>div,.hero-actions .button,.header-controls,.site-header .header-inner')].map(rect);
                  const cards=[...document.querySelectorAll('.product-card')].map(rect);
                  const roles=[...document.querySelectorAll('.edu-role')].map(rect);
                  const nav=document.querySelector('.site-navigation');
                  const navVisible=getComputedStyle(nav).display!=='none';
                  const header=document.querySelector('.header-inner');
                  return {overflow:document.documentElement.scrollWidth-innerWidth,bounds,cards,roles,headerWidth:header.clientWidth,headerScroll:header.scrollWidth,navVisible,brokenImages:[...document.images].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.src),badLinks:[...document.querySelectorAll('a[href^="#"]')].filter(a=>!document.querySelector(a.getAttribute('href'))).map(a=>a.getAttribute('href'))};
                });
                assert.ok(layout.overflow<=1,width+' '+lang+' horizontal overflow '+layout.overflow);
                assert.ok(layout.bounds.every(r=>r.x>=-1&&r.right<=width+1),width+' '+lang+' layout exceeds viewport');
                assert.ok(layout.headerScroll<=layout.headerWidth+2,width+' '+lang+' header overflow');
                assert.deepEqual(layout.brokenImages,[]);
                assert.deepEqual(layout.badLinks,[]);
                if(width>=1101){assert.ok(layout.cards.every(r=>Math.abs(r.y-layout.cards[0].y)<2&&Math.abs(r.height-layout.cards[0].height)<2),width+' unequal product cards');}
                if(width>900){assert.ok(layout.roles.every(r=>Math.abs(r.y-layout.roles[0].y)<2&&Math.abs(r.height-layout.roles[0].height)<2),width+' unequal role cards');}
                await page.evaluate(()=>window.scrollTo(0,0));
                await page.waitForTimeout(100);
                assert.equal(await page.locator('.site-header').evaluate(e=>getComputedStyle(e,'::after').opacity),'0');
                await page.locator('#edu').scrollIntoViewIfNeeded();
                await page.waitForTimeout(120);
                assert.equal(await page.locator('.site-header').evaluate(e=>getComputedStyle(e,'::after').opacity),'1');
                await page.locator('#edu [data-interest]').click();
                assert.equal(await page.locator('#contact-interest').inputValue(),'AmpAI Edu');
                if(width<=1020){
                  await page.locator('[data-menu-toggle]').click();
                  assert.equal(await page.locator('[data-menu-toggle]').getAttribute('aria-expanded'),'true');
                  await page.locator('[data-nav] a[href="#edu"]').click();
                  assert.equal(await page.locator('[data-menu-toggle]').getAttribute('aria-expanded'),'false');
                }
                if([1440,1024,768,390,360].includes(width)){
                  await page.locator('#products').screenshot({path:'evidence/products-'+width+'-'+lang+'.png'});
                  await page.locator('#edu').screenshot({path:'evidence/edu-'+width+'-'+lang+'.png'});
                  if(width===1440||width===390){await page.evaluate(()=>window.scrollTo(0,0));await page.screenshot({path:'evidence/hero-'+width+'-'+lang+'.png'});}
                }
                reports.push({width,lang,overflow:layout.overflow,cards:layout.cards,roles:layout.roles,passed:true});
              }
              // Intercept the contact request: exercise form without sending real mail.
              await page.route('https://formsubmit.co/ajax/**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({success:'true'})}));
              await page.locator('#contact-name').fill('QA synthetic');
              await page.locator('#contact-email').fill('qa@example.invalid');
              await page.locator('#contact-interest').selectOption('AmpAI Edu');
              await page.locator('#contact-message').fill('Synthetic test only: intercepted by browser.');
              await page.locator('[data-contact-submit]').click();
              await page.locator('[data-contact-status][data-status="success"]').waitFor();
              assert.deepEqual(errors,[],width+' JS errors');assert.deepEqual(badResponses,[],width+' broken assets');
              await page.close();
            }
          } finally {
            fs.writeFileSync('evidence/report.json',JSON.stringify(reports,null,2));
            await browser.close();
          }
          console.log('PASS: '+reports.length+' responsive language cases, navigation, CTA, assets, form intercepted, scroll reveal and alignment.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ampai-edu-landing-qa
          path: evidence/
          retention-days: 5
